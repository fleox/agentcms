name: Release

# Push a tag made by `npm version <patch|minor|major>` (vX.Y.Z) to publish
# that version to npm and create the GitHub Release. See docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub Release
  id-token: write # npm trusted publishing (OIDC, no npm token stored)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run build
      - name: Committed dist/ matches the sources
        run: |
          if ! git diff --quiet -- dist || [ -n "$(git ls-files --others --exclude-standard dist)" ]; then
            git status --short dist
            echo "::error::dist/ committed for this tag is out of date."
            exit 1
          fi
      - run: npm run check:skills
      # Trusted publishing needs npm >= 11.5.1 — upgraded only now: building
      # with another npm than the CI's can change the bundles (and the
      # committed dist/ check above would no longer hold).
      - run: npm install -g npm@latest
      # Idempotent: the very first version is published by hand (npm only
      # allows trusted publishing on an existing package).
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          # Plain registry read (setup-node's placeholder token can make npm view fail).
          if curl -fsS "https://registry.npmjs.org/@agent-cms%2fagentcms/$version" >/dev/null 2>&1; then
            echo "@agent-cms/agentcms@$version is already on npm — skipping publish."
          else
            npm publish --provenance --access public
          fi
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const v = require("./package.json").version;
            const e = require("./changelog.json").versions.find((x) => x.version === v);
            const lines = [];
            if (e.breaking) lines.push("**Breaking changes — read before updating.**", "");
            lines.push(...e.changes.map((c) => "- " + c));
            if (e.actions.length) lines.push("", "After updating a hosted site: " + e.actions.map((a) => "`" + a + "`").join(", "));
            lines.push("", "Install / update: `npx -y @agent-cms/agentcms@" + v + " help` — Claude Code: `/plugin marketplace update agentcms`.");
            require("fs").writeFileSync("release-notes.md", lines.join("\n") + "\n");
          '
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
